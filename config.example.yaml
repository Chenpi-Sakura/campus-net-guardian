# CUIT Helper — 配置示例
#
# 复制本文件为 config.yaml 并填写真实信息：
#   copy config.example.yaml config.yaml      (Windows)
#   cp    config.example.yaml config.yaml      (Linux/macOS)
#
# 重要：config.yaml 已在 .gitignore 中，绝不可提交到版本库。
# 本文件中所有敏感字段必须留空或写 __REPLACE_ME__。

# 校园网认证门户基础地址（真实值填入本地 config.yaml）
portal:
  # 入口页面（浏览器登录时打开的 URL）
  entry_url: "http://__PORTAL_HOST__/pc/center"

  # 网关拦截探测站：必须是一个【非白名单 HTTP 站点】。
  # 离线/未完全认证时，校园网关会把它重定向到 /eportal/index.jsp，
  # 从而拿到 eportal 认证的 flowSessionId（实测唯一有效的 sessionId 来源）。
  # 如果某天发现探测站被放行（拿不到 sessionId），换成其它外网 HTTP 站即可。
  probe_url: "http://www.sina.com.cn/"

  # 认证 API 根地址（用于 eportal/* 和 sam/api/* 等接口）
  api_base: "http://__PORTAL_HOST__"

  # 运营商选择：
  #   cmcc   - 中国移动
  #   ctcc   - 中国电信
  #   unicom - 中国联通
  service: "cmcc"

  # 请求超时（秒）
  timeout: 10

  # HTTP User-Agent
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 账号信息（敏感！仅在本地 config.yaml 中填入）
account:
  username: "__REPLACE_ME__"   # 学号 / 工号
  password: "__REPLACE_ME__"   # 门户登录密码

# 校园跑的本机设置；主页临时选校区不会回写默认值
running:
  phone: ""
  password: ""
  default_campus: "demo-a"
  # 本地相对米坐标 JSON；留空使用内置校区地图，格式见 config.routes.example.json
  catalog_file: ""

# 校园跑平台接入契约（敏感！仅在本机 config.yaml 填写，修改后重启生效）
# base_url 留空表示禁用平台登录与记录提交；本地预览始终不连接平台
running_platform:
  base_url: ""          # 平台服务根地址，必须 https
  app_key: ""           # 平台客户端 appkey
  app_secret: ""        # 平台请求签名密钥
  school_id: ""         # 平台学校 ID（数字）
  app_version: "1.8.0"  # 上报的客户端版本号
  brand: ""             # 上报的手机品牌
  mobile_type: ""       # 上报的手机型号
  sys_version: ""       # 上报的手机系统版本
  device_type: "1"      # 上报的设备类型标识
  device_token: ""      # 上报的设备推送令牌，可为空

# WiFi 配置（需与 portal 配置配合；真实 SSID 仅在本地 config.yaml 中配置）
wifi:
  # 目标 SSID（必须在 Windows 上手动连接过一次，让系统保存 profile）
  ssid: "__WIFI_SSID__"

  # 可选：netsh add profile 用的 XML 文件路径（首次配置时）
  profile_xml: ""

  # 连接超时（秒）：WiFi 连上 / 探测网络可达
  connect_timeout: 15

  # 备用网络（可选）：主 SSID 连不上时的兜底，例如手机热点。GUI 面板同名「备用网络」。
  # 敏感值（SSID / 密码）只在本地 config.yaml 填写，仓库仅保留占位符。
  # 设计详见 docs/fallback-network-plan.md。
  fallback:
    enabled: false
    ssid: "__FALLBACK_WIFI_SSID__"
    password: "__FALLBACK_WIFI_PASSWORD__"   # 留空 → 假定系统已保存 profile
    retry: 3                 # 连接备用网络的重试次数
    retry_delay: 2.0         # 每次重试间隔（秒）
    connect_timeout: 20      # 连接超时（秒）
    encryption: "WPA2PSK"    # open / WPAPSK / WPA2PSK / WPA3SAE
    auth: "AES"              # open / TKIP / AES
    switch_back_interval: 0  # 0=不自动切回主网；>0=每 N 秒尝试切回一次
    revert_on_stop: false    # true=daemon 退出时自动切回备用网络（典型用途：测试场景）

# 守护参数
daemon:
  # 探测间隔（秒）：检查是否还在线
  probe_interval: 30

  # 连续失败多少次后触发重连
  failure_threshold: 3

  # 重连退避策略（秒）：失败后等待时间
  reconnect_backoff:
    initial: 5
    max: 300
    factor: 2

# 日志
logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  # 日志文件路径，留空使用用户目录 campus-guardian/guardian.log
  file: ""
  # 单文件最大字节数
  max_bytes: 10485760          # 10 MB
  # 保留备份数
  backup_count: 5

# 环境变量覆盖（优先级：环境变量 > YAML）
# 可选的本地进程环境变量：
#   CNG_USERNAME, CNG_PASSWORD, CNG_SERVICE, CNG_LOG_LEVEL
env_overrides:
  username: "CNG_USERNAME"
  password: "CNG_PASSWORD"
  service:  "CNG_SERVICE"
  log_level: "CNG_LOG_LEVEL"
